name: Offline validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q src tests data.py helpers.py

      - name: Collect tests without integration requests
        env:
          STELLAR_BURGERS_BASE_URL: https://api.example.invalid
        # Collection imports modules but must never execute API requests.
        # The empty network namespace also blocks accidental import-time I/O.
        run: sudo -n unshare --net -- .venv/bin/python -B -m pytest --collect-only -q -p no:cacheprovider
